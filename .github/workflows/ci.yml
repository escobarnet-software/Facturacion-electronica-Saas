name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Pruebas, Pint y Larastan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dte_test
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dte -d dte_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: dte
      DB_PASSWORD: dte
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan (nivel 6)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pruebas
        run: php artisan test

  docker:
    name: Servicios Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - name: Construir el firmador oficial
        run: docker compose build firmador
