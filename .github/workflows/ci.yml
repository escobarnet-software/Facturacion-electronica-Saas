name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Pruebas, Pint y Larastan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dte_test
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dte -d dte_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      # La app usa un rol SIN superusuario ni BYPASSRLS: si no, RLS no se aplicaría.
      DB_USERNAME: dte_app
      DB_PASSWORD: dte_app
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, mbstring, zip, gd
          coverage: none
          tools: composer:v2

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vulnerabilidades conocidas (Composer)
        run: composer audit --no-dev

      - name: Crear el rol de la aplicación (dte_app)
        env:
          PGPASSWORD: dte
        run: |
          psql -h 127.0.0.1 -U dte -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dte_app LOGIN PASSWORD 'dte_app' NOSUPERUSER NOBYPASSRLS NOCREATEROLE" \
            -c "ALTER DATABASE dte_test OWNER TO dte_app"
          psql -h 127.0.0.1 -U dte -d dte_test -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO dte_app"

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan (nivel 6)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pruebas
        run: php artisan test

      - name: Respaldo y prueba de restauración (pg_dump 17)
        env:
          DB_DATABASE: dte_test
        run: |
          php artisan migrate:fresh --seed --force
          docker run --rm --network host -v "$PWD/scripts:/s:ro" -v "$RUNNER_TEMP:/r" \
            -e PGHOST=127.0.0.1 -e PGUSER=dte -e PGPASSWORD=dte -e PGDATABASE=dte_test \
            postgres:17-alpine sh -c 'apk add --no-cache bash >/dev/null && bash /s/respaldo-bd.sh /r && bash /s/probar-restauracion.sh "$(ls -t /r/*.dump | head -1)" dte_test'

  docker:
    name: Servicios Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - name: Configuración de la demo y de la conexión con Hacienda
        run: docker compose -f docker-compose.demo.yml -f docker-compose.hacienda.yml config -q
      - name: El archivo de correo real se aplica a la demo
        run: docker compose --env-file correo.env.example -f docker-compose.demo.yml config | grep -q "smtp-relay.brevo.com"
      - name: Construir el firmador oficial
        run: docker compose build firmador
      - name: Construir la imagen de producción de la aplicación
        run: docker build -f docker/app/Dockerfile -t escobarnet-dte-app:ci .
      - name: La imagen arranca y responde /up
        run: |
          docker run -d --name app -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e DTE_SECRETS_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_ENV=production -e DB_CONNECTION=pgsql -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            escobarnet-dte-app:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/up && exit 0; sleep 2; done
          docker logs app; exit 1

  firmador-real:
    name: Firma real con el firmador oficial (certificado ficticio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, mbstring, zip, gd, openssl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && echo "DTE_SECRETS_KEY=base64:$(openssl rand -base64 32)" >> .env
      - name: Construir y levantar el firmador oficial
        run: |
          docker build -t firmador ./docker/firmador
          mkdir -p "$RUNNER_TEMP/certs" && chmod 777 "$RUNNER_TEMP/certs"
          docker run -d --name firmador -p 127.0.0.1:8113:8113 -e SPRING_PROFILES_ACTIVE=nonssl -v "$RUNNER_TEMP/certs:/uploads:ro" firmador
          for i in $(seq 1 60); do curl -s -o /dev/null -X POST http://127.0.0.1:8113/firmardocumento/ -H 'Content-Type: application/json' -d '{}' && break; sleep 3; done
      - name: Firmar y verificar la firma RS512
        env:
          DTE_FIRMADOR_URL: http://127.0.0.1:8113/firmardocumento/
          DTE_SIMULADOR_URL: ''
        run: DTE_CERTIFICADOS_PATH="$RUNNER_TEMP/certs" php artisan dte:firmador:verificar

  demo:
    name: Demo con Docker (docker-compose.demo.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Levantar la demo
        run: docker compose -f docker-compose.demo.yml up -d --build
      - name: El panel responde y la demo permite iniciar sesión
        run: |
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8000/login && break; sleep 3; done
          docker compose -f docker-compose.demo.yml logs preparar | grep -q "Demo lista"
          token=$(curl -fsS -c c.txt http://127.0.0.1:8000/login | grep -o 'name="_token" value="[^"]*"' | cut -d'"' -f4)
          destino=$(curl -sS -b c.txt -c c.txt -o /dev/null -w '%{redirect_url}' \
            --data-urlencode "_token=$token" --data-urlencode "email=contador@demo.test" --data-urlencode 'password=Demo2026!' \
            http://127.0.0.1:8000/login)
          echo "Después del login: $destino"
          [[ "$destino" == */panel ]]
          curl -fsS -b c.txt http://127.0.0.1:8000/panel/emitir | grep -q "Pupusa revuelta"
          # Cada pantalla del panel debe abrir dentro de la imagen (detecta extensiones de PHP que falten).
          for p in panel panel/emitir panel/caja panel/documentos panel/invalidaciones panel/recibidos panel/reportes panel/contingencia panel/productos panel/clientes panel/establecimientos; do
            codigo=$(curl -sS -b c.txt -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/$p")
            echo "$p → $codigo"; [[ "$codigo" == "200" ]]
          done
      - name: Pruebas mínimas de Hacienda contra el simulador (como en la guía)
        run: |
          docker compose -f docker-compose.demo.yml exec -T web php artisan dte:pruebas-minimas 06141507261015 --tipos=01,03,05,invalidacion,contingencia
          curl -fsS http://127.0.0.1:8899/simulador/estado | grep -q "en línea"
      - name: Escaneo de seguridad OWASP ZAP (pasivo) contra la demo
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -m 2 -r zap.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-zap
          path: zap/zap.html
          if-no-files-found: ignore
      - name: Registros si falla
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=80

  assets:
    name: Assets (Vite + Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades conocidas (npm, altas y críticas)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
