# Servicios de desarrollo de la plataforma DTE de Escobar Net.
#   docker compose up -d
# Todos los puertos se publican solo en 127.0.0.1 (nunca hacia la red).
name: escobarnet-dte

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dte
      POSTGRES_USER: dte
      POSTGRES_PASSWORD: dte
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dte -d dte"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Almacenamiento compatible con S3 para desarrollo (sustituye a MinIO, cuyas
  # imágenes ya no se publican en Docker Hub). En producción: S3 con versionado
  # y object lock.
  s3:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=5
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Crea el bucket de DTE con versionado (idempotente).
  s3-init:
    image: amazon/aws-cli:2.40.0
    depends_on:
      s3: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: dte-s3
      AWS_SECRET_ACCESS_KEY: dte-s3-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket dte-archivo 2>/dev/null ||
        aws --endpoint-url http://s3:8333 s3api create-bucket --bucket dte-archivo &&
        aws --endpoint-url http://s3:8333 s3api put-bucket-versioning --bucket dte-archivo --versioning-configuration Status=Enabled &&
        echo 'Bucket dte-archivo listo'
    restart: "no"

  firmador:
    image: escobarnet-dte-firmador:2.0.0
    build: ./docker/firmador
    environment:
      TZ: America/El_Salvador
      # El puerto 8113 se activa con el perfil "nonssl" (application.yml oficial).
      SPRING_PROFILES_ACTIVE: nonssl
    volumes:
      - ./storage/app/private/certificados:/uploads:ro
    ports: ["127.0.0.1:8113:8113"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8113/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  s3data:
